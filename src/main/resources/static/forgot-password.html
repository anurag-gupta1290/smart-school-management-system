<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart School · Forgot Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e2eef9 0%, #c5d8e8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        .forgot-card {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            border-radius: 56px;
            padding: 3rem 3rem 3.2rem;
            box-shadow: 0 40px 80px -20px rgba(8, 40, 60, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .brand {
            font-size: 1.25rem;
            background: linear-gradient(135deg, #0b3b4f, #1b6b8a);
            padding: 0.35rem 1.8rem;
            border-radius: 60px;
            color: white;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 14px rgba(11, 59, 79, 0.25);
        }

        .brand i { font-size: 1.1rem; }

        h2 { color: #0b2a3b; font-size: 1.8rem; margin-bottom: 0.5rem; }
        .subtitle { color: #1b6b8a; font-size: 0.95rem; margin-bottom: 2rem; }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #0f3f55;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 0.4rem;
        }

        label i { color: #1b6b8a; }

        input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border-radius: 30px;
            border: 1.5px solid #dce8f2;
            background: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            transition: 0.25s ease;
            outline: none;
            color: #0b2a3b;
        }

        input:focus {
            border-color: #0b3b4f;
            background: white;
            box-shadow: 0 4px 20px rgba(12, 60, 80, 0.10);
        }

        .btn {
            padding: 0.9rem 1.5rem;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-primary {
            background: #0b3b4f;
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: #082e3f;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px -8px rgba(8, 50, 70, 0.35);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-outline {
            background: transparent;
            color: #1b6b8a;
            border: 1.5px solid #1b6b8a;
            padding: 0.7rem 1.2rem;
            font-size: 0.85rem;
            width: 100%;
            margin-top: 0.8rem;
        }

        .btn-outline:hover {
            background: #1b6b8a;
            color: white;
        }

        .btn-success {
            background: #27ae60;
            color: white;
            width: 100%;
        }

        .btn-success:hover {
            background: #219a52;
        }

        .alert {
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .alert.show { display: flex; }
        .alert-success { background: rgba(46, 204, 113, 0.15); color: #1a7a4a; border: 1px solid rgba(46, 204, 113, 0.3); }
        .alert-error { background: rgba(231, 76, 60, 0.15); color: #a93226; border: 1px solid rgba(231, 76, 60, 0.3); }
        .alert-warning { background: rgba(241, 196, 15, 0.15); color: #7d6608; border: 1px solid rgba(241, 196, 15, 0.3); }

        .timer {
            font-size: 0.85rem;
            color: #1b6b8a;
            text-align: center;
            margin: 0.5rem 0;
        }

        .timer .countdown {
            font-weight: 700;
            color: #e74c3c;
            font-size: 1.1rem;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #1b6b8a;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            color: #0b3b4f;
        }

        .step {
            display: none;
        }
        .step.active { display: block; }

        .otp-inputs {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
        }

        .otp-inputs input {
            width: 55px;
            height: 60px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .password-requirements {
            font-size: 0.75rem;
            color: #1b6b8a;
            margin-top: 0.3rem;
        }

        .password-requirements .valid { color: #27ae60; }
        .password-requirements .invalid { color: #e74c3c; }
    </style>
</head>
<body>

<div class="forgot-card">
    <div class="brand">
        <i class="fas fa-school"></i> Smart School
    </div>

    <h2><i class="fas fa-key" style="color:#1b6b8a;"></i> Forgot Password</h2>
    <p class="subtitle">Reset your password in 2 easy steps</p>

    <div id="alertMessage" class="alert">
        <i class="fas fa-info-circle"></i>
        <span id="alertText">Message</span>
    </div>

    <div class="step active" id="step1">
        <p style="color:#1b6b8a; margin-bottom:1.5rem;">Enter your registered email address. We'll send you a 6-digit OTP.</p>

        <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email Address</label>
            <input type="email" id="emailInput" placeholder="you@example.com" required />
        </div>

        <button class="btn btn-primary" id="sendOtpBtn">
            <i class="fas fa-paper-plane"></i> Send OTP
        </button>
    </div>

    <div class="step" id="step2">
        <p style="color:#1b6b8a; margin-bottom:1.5rem;">Enter OTP sent to <strong id="displayEmail"></strong> and set new password.</p>

        <div class="form-group">
            <label><i class="fas fa-shield-alt"></i> Enter OTP</label>
            <div class="otp-inputs" id="otpContainer">
                <input type="text" maxlength="1" class="otp-input" />
                <input type="text" maxlength="1" class="otp-input" />
                <input type="text" maxlength="1" class="otp-input" />
                <input type="text" maxlength="1" class="otp-input" />
                <input type="text" maxlength="1" class="otp-input" />
                <input type="text" maxlength="1" class="otp-input" />
            </div>
        </div>

        <div class="timer" id="timerDisplay">
            <i class="fas fa-clock"></i> OTP expires in: <span class="countdown" id="countdown">60</span>s
        </div>

        <div class="form-group">
            <label><i class="fas fa-lock"></i> New Password</label>
            <input type="password" id="newPasswordInput" placeholder="••••••••" />
        </div>

        <div class="form-group">
            <label><i class="fas fa-redo"></i> Confirm Password</label>
            <input type="password" id="confirmPasswordInput" placeholder="••••••••" />
        </div>

        <div class="password-requirements">
            <span id="lengthCheck"><i class="fas fa-circle"></i> Minimum 8 characters</span><br>
            <span id="letterCheck"><i class="fas fa-circle"></i> At least one letter</span><br>
            <span id="numberCheck"><i class="fas fa-circle"></i> At least one number</span>
        </div>

        <button class="btn btn-success" id="resetPasswordBtn">
            <i class="fas fa-key"></i> Reset Password
        </button>

        <button class="btn btn-outline" id="resendOtpBtn">
            <i class="fas fa-redo"></i> Resend OTP
        </button>
    </div>

    <a href="login.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Login
    </a>
</div>

<script>
    //const API_BASE_URL = 'http://15.207.174.107:8083/api';
      const API_BASE_URL = 'http://localhost:8083/api';

    //const API_BASE_URL = 'http://15.207.174.107:8083/api/auth';

    const emailInput = document.getElementById('emailInput');
    const sendOtpBtn = document.getElementById('sendOtpBtn');
    const resendOtpBtn = document.getElementById('resendOtpBtn');
    const resetPasswordBtn = document.getElementById('resetPasswordBtn');

    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');

    const alertMessage = document.getElementById('alertMessage');
    const alertText = document.getElementById('alertText');
    const displayEmail = document.getElementById('displayEmail');
    const countdown = document.getElementById('countdown');

    const otpInputs = document.querySelectorAll('.otp-input');
    const newPasswordInput = document.getElementById('newPasswordInput');
    const confirmPasswordInput = document.getElementById('confirmPasswordInput');

    const lengthCheck = document.getElementById('lengthCheck');
    const letterCheck = document.getElementById('letterCheck');
    const numberCheck = document.getElementById('numberCheck');

    let currentEmail = '';
    let timerInterval = null;
    let timeLeft = 60;

    function showAlert(message, type = 'error') {
        alertMessage.className = `alert show alert-${type}`;
        alertText.textContent = message;
        clearTimeout(window.alertTimeout);
        window.alertTimeout = setTimeout(clearAlert, 5000);
    }

    function clearAlert() {
        alertMessage.className = 'alert';
        alertText.textContent = '';
    }

    function showStep(stepNumber) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById(`step${stepNumber}`).classList.add('active');
    }

    otpInputs.forEach((input, index) => {
        input.addEventListener('input', function() {
            if (this.value.length === 1 && index < 5) {
                otpInputs[index + 1].focus();
            }
        });

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && this.value.length === 0 && index > 0) {
                otpInputs[index - 1].focus();
            }
        });
    });

    function getOTP() {
        let otp = '';
        otpInputs.forEach(input => otp += input.value);
        return otp;
    }

    function checkPasswordStrength(password) {
        const hasLength = password.length >= 8;
        const hasLetter = /[a-zA-Z]/.test(password);
        const hasNumber = /\d/.test(password);

        lengthCheck.innerHTML = `<i class="fas ${hasLength ? 'fa-check-circle' : 'fa-circle'}"></i> Minimum 8 characters`;
        lengthCheck.className = hasLength ? 'valid' : 'invalid';

        letterCheck.innerHTML = `<i class="fas ${hasLetter ? 'fa-check-circle' : 'fa-circle'}"></i> At least one letter`;
        letterCheck.className = hasLetter ? 'valid' : 'invalid';

        numberCheck.innerHTML = `<i class="fas ${hasNumber ? 'fa-check-circle' : 'fa-circle'}"></i> At least one number`;
        numberCheck.className = hasNumber ? 'valid' : 'invalid';

        return hasLength && hasLetter && hasNumber;
    }

    newPasswordInput.addEventListener('input', function() {
        checkPasswordStrength(this.value);
    });

    function startTimer() {
        timeLeft = 60;
        countdown.textContent = timeLeft;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            countdown.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                countdown.textContent = '0';
                showAlert('OTP has expired. Please request a new one.', 'warning');
            }
        }, 1000);
    }

    sendOtpBtn.addEventListener('click', async function() {
        const email = emailInput.value.trim();

        if (!email || !email.includes('@') || !email.includes('.')) {
            showAlert('Please enter a valid email address.', 'error');
            return;
        }

        this.disabled = true;
        this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

        try {
            const response = await fetch(`${API_BASE_URL}/forgot-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await response.json();

            if (response.ok) {
                currentEmail = email;
                displayEmail.textContent = email;
                showAlert('✅ OTP sent successfully! Check your email.', 'success');
                showStep(2);
                startTimer();
                otpInputs.forEach(input => input.value = '');
                otpInputs[0].focus();
            } else {
                showAlert('❌ ' + (data.error || 'Failed to send OTP'), 'error');
            }
        } catch (error) {
            console.error('Error sending OTP:', error);
            if (error.message.includes('Failed to fetch')) {
                showAlert('⚠️ Backend server not running. Using demo mode.', 'warning');
                currentEmail = email;
                displayEmail.textContent = email;
                showAlert('✅ Demo OTP sent: 123456', 'success');
                showStep(2);
                startTimer();
                otpInputs.forEach(input => input.value = '');
                otpInputs[0].focus();
            } else {
                showAlert('❌ ' + (error.message || 'Network error'), 'error');
            }
        } finally {
            this.disabled = false;
            this.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP';
        }
    });

    resendOtpBtn.addEventListener('click', async function() {
        if (!currentEmail) {
            showAlert('Please enter email first.', 'warning');
            showStep(1);
            return;
        }

        this.disabled = true;
        this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resending...';

        try {
            const response = await fetch(`${API_BASE_URL}/resend-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: currentEmail })
            });

            const data = await response.json();

            if (response.ok) {
                otpInputs.forEach(input => input.value = '');
                otpInputs[0].focus();
                showAlert('✅ New OTP sent! Check your email.', 'success');
                startTimer();
            } else {
                showAlert('❌ ' + (data.error || 'Failed to resend OTP'), 'error');
            }
        } catch (error) {
            console.error('Error resending OTP:', error);
            if (error.message.includes('Failed to fetch')) {
                otpInputs.forEach(input => input.value = '');
                otpInputs[0].focus();
                showAlert('✅ Demo OTP resent: 123456', 'success');
                startTimer();
            } else {
                showAlert('❌ ' + (error.message || 'Network error'), 'error');
            }
        } finally {
            this.disabled = false;
            this.innerHTML = '<i class="fas fa-redo"></i> Resend OTP';
        }
    });

    resetPasswordBtn.addEventListener('click', async function() {
        const otp = getOTP();
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (otp.length !== 6) {
            showAlert('Please enter complete 6-digit OTP.', 'warning');
            return;
        }

        if (!newPassword || !confirmPassword) {
            showAlert('Please fill both password fields.', 'warning');
            return;
        }

        if (newPassword !== confirmPassword) {
            showAlert('Passwords do not match.', 'error');
            return;
        }

        if (!checkPasswordStrength(newPassword)) {
            showAlert('Please meet all password requirements.', 'warning');
            return;
        }

        this.disabled = true;
        this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';

        try {
            const response = await fetch(`${API_BASE_URL}/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: currentEmail,
                    otp: otp,
                    newPassword: newPassword
                })
            });

            const data = await response.json();

            if (response.ok) {
                clearInterval(timerInterval);
                showAlert('✅ Password reset successfully! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                showAlert('❌ ' + (data.error || 'Failed to reset password'), 'error');
            }
        } catch (error) {
            console.error('Error resetting password:', error);
            if (error.message.includes('Failed to fetch')) {
                showAlert('✅ Demo: Password reset successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                showAlert('❌ ' + (error.message || 'Network error'), 'error');
            }
        } finally {
            this.disabled = false;
            this.innerHTML = '<i class="fas fa-key"></i> Reset Password';
        }
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            if (step1.classList.contains('active')) {
                sendOtpBtn.click();
            } else if (step2.classList.contains('active')) {
                resetPasswordBtn.click();
            }
        }
    });

    showStep(1);

    console.log('🔑 Smart School Forgot Password Page');
    console.log(`📍 API: ${API_BASE_URL}`);
    console.log('💡 Demo OTP: 123456');
</script>
</body>
</html>
